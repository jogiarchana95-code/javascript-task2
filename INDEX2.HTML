<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Link Example</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .container{
      width: 400px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h1{
      color: #1e3c72;
      margin-bottom: 20px;
      font-size: 32px;
    }

    p{
      color: #555;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn{
      display: inline-block;
      padding: 12px 25px;
      background: #1e3c72;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover{
      background: #2a5298;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>JavaScript Task 2</h1>
    <p>Open the browser console to view JavaScript output.</p>

    <a href="#" class="btn">JS Connected Successfully</a>
  </div>

  <script src="JS-TASK2.js"></script>

</body>
</html>
